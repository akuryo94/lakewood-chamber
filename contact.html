<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Lakewood Chamber</title>
<meta name="description" content="Contact the New Lakewood Chamber of Commerce.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='4' fill='%23155E75'/><circle cx='26' cy='22' r='5' fill='%23E9A93B'/></svg>">
</head>
<body data-page="contact">
<header id="site-header"></header>
<main id="main">
<section class="page-hero"><div class="wrap">
  <h1>Contact</h1>
  <p>Questions about membership, events or hosting a mixer? Send us a message.</p>
</div></section>
<section class="section"><div class="wrap">
  <form class="form" id="contact-form" method="POST">
    <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="c-business">Business name</label><input id="c-business" name="business" autocomplete="organization"></div>
    <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
    <div><button class="btn" type="submit">Send message</button></div>
  </form>
  <div class="notice" id="contact-fallback" hidden>
    <p style="margin:0">Email us at <a data-email href="#"></a> and we will reply within two business days.</p>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="data/site-data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
